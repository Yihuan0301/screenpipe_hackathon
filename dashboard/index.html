<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LaunchShadow 运营看板</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">LaunchShadow<span>· 运营看板</span></div>
    <div class="controls">
      <select id="range" title="时间范围">
        <option value="all">全部时间</option>
        <option value="7">最近 7 天</option>
        <option value="30">最近 30 天</option>
      </select>
      <label class="btn">选择 JSON<input type="file" id="file" accept=".json,application/json" hidden></label>
      <button class="btn" id="demo-btn">加载 Demo</button>
    </div>
    <div class="status" id="status">尚未加载数据</div>
  </header>

  <main>
    <div id="drop" class="drop">把 JSON 文件拖到这里（只在本地浏览器处理）</div>

    <section id="overview" class="grid"></section>

    <section id="detail" class="detail" hidden>
      <div class="detail-head">
        <button class="btn" id="back">← 返回概览</button>
        <h2 id="detail-title"></h2>
        <input id="detail-search" type="search" placeholder="搜索标题、详情、ref">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>类型</th><th>来源</th><th>日期</th><th class="num">金额</th><th>币种</th>
            <th>标题</th><th>详情</th><th>ref</th><th>链接</th>
          </tr></thead>
          <tbody id="detail-rows"></tbody>
        </table>
      </div>
      <p class="muted" id="detail-count"></p>

      <div id="comments-block" hidden>
        <h3>评论明细（小红书等抓取记录）</h3>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>平台</th><th>笔记</th><th>用户</th><th>层级</th><th>回复对象</th>
              <th>作者回复</th><th>内容</th><th>首次出现</th>
            </tr></thead>
            <tbody id="comment-rows"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="schema" class="detail" hidden>
      <h2>统一记录格式</h2>
      <table>
        <thead><tr><th>字段</th><th>必填</th><th>说明</th></tr></thead>
        <tbody id="schema-rows"></tbody>
      </table>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
